<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CODSOFT Task 2 - Contact Management System API</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <header>
    <div class="header-container">
      <div class="logo">
        <span class="badge">TASK 2</span>
        <h1>Contact Management System API</h1>
      </div>
      <div class="meta">
        <span>Intern: <strong>Bheemereddi Yaswanth Durga Bose</strong></span>
        <span class="badge-codsoft">CodSoft CIP</span>
      </div>
    </div>
  </header>

  <main class="container">
    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-title">Total Contacts</div>
        <div class="stat-val" id="stat-total">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-title">Work Contacts</div>
        <div class="stat-val" id="stat-work">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-title">Personal Contacts</div>
        <div class="stat-val" id="stat-personal">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-title">Starred Favorites</div>
        <div class="stat-val" id="stat-fav">0</div>
      </div>
    </div>

    <div class="action-bar">
      <div class="search-box">
        <input type="text" id="contact-search" placeholder="Search by name, email, or phone..." oninput="loadContacts()">
        <select id="category-filter" onchange="loadContacts()">
          <option value="">All Categories</option>
          <option value="personal">Personal</option>
          <option value="work">Work</option>
          <option value="other">Other</option>
        </select>
        <select id="fav-filter" onchange="loadContacts()">
          <option value="">All Contacts</option>
          <option value="1">⭐ Favorites Only</option>
        </select>
        <select id="sort-filter" onchange="loadContacts()">
          <option value="name">Sort by Name</option>
          <option value="company">Sort by Company</option>
          <option value="created_at">Sort by Date</option>
        </select>
      </div>
      <button class="btn btn-primary" onclick="openAddModal()">+ Add New Contact</button>
    </div>

    <div class="contact-grid" id="contact-list">
      <div class="loading">Loading contacts...</div>
    </div>
  </main>

  <!-- Modal -->
  <div id="modal" class="modal-backdrop hidden">
    <div class="modal-box">
      <div class="modal-header">
        <h3 id="modal-title">Contact Details</h3>
        <button class="close-btn" onclick="closeModal()">&times;</button>
      </div>
      <form id="contact-form" onsubmit="saveContact(event)">
        <input type="hidden" id="c-id">
        <div class="form-group">
          <label>Full Name *</label>
          <input type="text" id="c-name" placeholder="John Doe" required />
        </div>
        <div class="form-group">
          <label>Email Address *</label>
          <input type="email" id="c-email" placeholder="john@example.com" required />
        </div>
        <div class="form-group">
          <label>Phone Number *</label>
          <input type="text" id="c-phone" placeholder="+91 9876543210" required />
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>Company</label>
            <input type="text" id="c-company" placeholder="Company Name" />
          </div>
          <div class="form-group">
            <label>Job Title</label>
            <input type="text" id="c-title" placeholder="Backend Engineer" />
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>Category</label>
            <select id="c-category">
              <option value="personal">Personal</option>
              <option value="work">Work</option>
              <option value="other">Other</option>
            </select>
          </div>
          <div class="form-group">
            <label>Address</label>
            <input type="text" id="c-address" placeholder="City, Country" />
          </div>
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%;margin-top:12px;">Save Contact</button>
      </form>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
